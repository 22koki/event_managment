name: Gather checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start test event desk
        env:
          EVENT_TEST_DATABASE: /tmp/gather-browser.sqlite3
        run: |
          python tests/browser_server.py > /tmp/gather-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gather-server.log
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gather-screenshots
          path: test-results/
