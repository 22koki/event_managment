{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('event_details',event_id=event.id) if editing else url_for('home') }}">← Back to event desk</a><div class="section-heading"><div><span class="eyebrow">LET’S BRING IT TOGETHER</span><h1>{{ title }}</h1><p>Set the date, make room, and give your guests something to look forward to.</p></div></div><form method="post" class="panel event-form"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Event name<input name="name" value="{{ event.name }}" required maxlength="120" placeholder="A gathering worth remembering"></label><div class="form-grid"><label>Date<input name="date" value="{{ event.date }}" required type="date"></label><label>Start time<input name="time" value="{{ event.time }}" required type="time"></label></div><label>Venue<input name="location" value="{{ event.location }}" required maxlength="160" placeholder="A place, a room, or an online link"></label><label>Capacity<input name="capacity" value="{{ event.capacity }}" required type="number" min="1" max="100000"></label><label>Description<textarea name="description" maxlength="3000" rows="5" placeholder="What’s the occasion?">{{ event.description }}</textarea></label><div class="actions"><button class="button primary">{{ 'Save changes' if editing else 'Create event' }} ↗</button><a class="button" href="{{ url_for('home') }}">Cancel</a></div></form>{% endblock %}
