{% extends 'base.html' %}{% block content %}<section class="panel"><span class="eyebrow">ONE LAST CHECK</span><h1>Delete {{ event.name }}?</h1><p>This permanently removes the event and all {{ event.enrolled }} registered attendees.</p><form method="post" class="actions"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="button danger">Yes, delete event</button><a class="button" href="{{ url_for('event_details',event_id=event.id) }}">Keep event</a></form></section>{% endblock %}
